name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time. A newer push waits behind the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run scripts/deploy.sh on the droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The `current` symlink is the release that's live now. Its deploy
          # script deploys the commit being pushed.
          script: /srv/thegroove/current/scripts/deploy.sh ${{ github.sha }}
          command_timeout: 30m
